<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- PWA Meta Tags -->
    <meta name="description" content="Smart Kids Learn & Read offers original early-learning activities for kids: alphabet, phonics, numbers, spelling, colors, shapes, stories, and creative games for home and classroom practice." />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#667eea" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Smart Kids" />
    
    <!-- Icons -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📚</text></svg>" />
    <link rel="apple-touch-icon" href="/icon-192x192.svg" />
    <link rel="manifest" href="/manifest.json" />
    
    <!-- Google Analytics 4 -->
    <!-- Replace 'G-XXXXXXXXXX' with your actual GA4 Measurement ID -->
    <script>
      window.GA4_MEASUREMENT_ID = 'G-XXXXXXXXXX'; // Replace with your GA4 ID
    </script>

    <!-- Google AdSense -->
    <!-- Replace ca-pub-XXXXXXXXXXXXXXXX with your AdSense publisher ID -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-XXXXXXXXXXXXXXXX" crossorigin="anonymous"></script>
    
    <title>Smart Kids Learn & Read</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    
    <!-- Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/service-worker.js')
            .then((registration) => {
              console.log('SW registered: ', registration);
            })
            .catch((registrationError) => {
              console.log('SW registration failed: ', registrationError);
            });
        });
      }
    </script>
  </body>
</html>
